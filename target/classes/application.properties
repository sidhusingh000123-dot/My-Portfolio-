# ===== Server =====
# Railway sets PORT automatically; ${PORT:8080} falls back to 8080 when running locally.
server.port=${PORT:8080}

# ===== MySQL Database =====
# ON RAILWAY (production):
# Railway's MySQL plugin automatically provides these environment variables
# (MYSQLHOST, MYSQLPORT, MYSQLUSER, MYSQLPASSWORD, MYSQLDATABASE) to any service
# in the same project once you link them. This reads them automatically - don't
# hardcode real values here.
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# LOCAL DEVELOPMENT (running on your own machine in IntelliJ):
# Since the line above expects Railway's env vars, running locally will fail unless
# you either (a) set those same env vars in your IntelliJ Run Configuration, or
# (b) temporarily comment out the 3 lines above and uncomment these 3 instead:
# spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true





