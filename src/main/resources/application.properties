# ===== Server =====
server.port=8080

# ===== MySQL Database =====
# 1. Create the database first (see README): CREATE DATABASE portfolio_db;
# 2. Update username/password below to match your local MySQL setup.
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Raja@200679
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update = keeps your data and just syncs schema changes. Use create-drop only if you want a fresh DB every run.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
